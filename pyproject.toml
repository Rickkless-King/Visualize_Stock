[project]
name = "visualize-stock"
version = "0.1.0"
description = "Interactive stock market visualization and AI copilot workspace."
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
